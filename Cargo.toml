[package]
name = "apfs-explorer"
version = "0.1.0"
edition = "2021"
description = "Penjelajah APFS (read-only) dengan UI Win32 native"
license = "MIT & Apache 2.0"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = true
strip = true
